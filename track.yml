name: Track Delhivery Parcel

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}      # lets you trigger a manual test run

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright browser (only if not cached)
        run: playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install just OS deps (cache hit case)
        run: playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Check if within 7-day tracking window
        id: window
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, os
          start = datetime.date.fromisoformat(os.environ["START_DATE"])
          days = (datetime.date.today() - start).days
          print(f"continue={'true' if 0 <= days <= 7 else 'false'}")
          EOF
        env:
          START_DATE: ${{ vars.START_DATE }}

      - name: Run tracker
        if: steps.window.outputs.continue == 'true'
        run: python track_delhivery.py
        env:
          WAYBILL: ${{ secrets.WAYBILL }}
          TO_PHONE: ${{ secrets.TO_PHONE }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH: ${{ secrets.TWILIO_AUTH }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}

      - name: Save updated status back to the repo
        if: steps.window.outputs.continue == 'true'
        run: |
          git config user.name "delhivery-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_status.json
          git diff --staged --quiet || git commit -m "Update tracking status"
          git push
